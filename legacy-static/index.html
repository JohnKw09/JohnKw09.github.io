<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>MyDay — zaplanuj swój dzień</title>
<link rel="stylesheet" href="styles.css"></head>
<body><div class="shell"><aside class="side"><div class="brand"><span class="logo">✳</span>myday</div><div class="side-label">Menu</div><nav class="nav"><button class="active" id="navToday"><span class="ico">◷</span> Mój dzień <span class="today-pill" id="navCount">0</span></button><button id="navAll"><span class="ico">▤</span> Wszystkie zadania</button></nav><div class="side-label" style="margin-top:27px">Kalendarz</div><div class="mini-cal"><div class="cal-head"><span id="monthLabel"></span><div class="cal-arrows"><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div><div class="week"><span>Pn</span><span>Wt</span><span>Śr</span><span>Cz</span><span>Pt</span><span>So</span><span>Nd</span></div><div class="days" id="calendarDays"></div></div><div class="side-bottom"><div class="avatar">M</div><div class="profile"><strong>Mój planer</strong><small>Dobrego dnia ✨</small></div></div></aside>
<main class="main"><header class="top"><div class="breadcrumb"><button class="mobile-menu" id="mobileToday">☰</button><b>Planer</b>&nbsp; / &nbsp;<span>Mój dzień</span></div><div class="date-control"><button id="prevDay" aria-label="Poprzedni dzień">‹</button><span id="fullDate"></span><button id="nextDay" aria-label="Następny dzień">›</button></div></header>
<section class="welcome"><div><div class="eyebrow" id="greeting">Dzień dobry ☀️</div><h1>Twój dzień,<br class="small-break"/><span>na Twoich zasadach.</span></h1></div><button class="new-btn" id="addTask"><span class="plus">＋</span> Nowe zadanie</button></section>
<section class="summary"><div class="sum-card progress"><div class="sum-top"><span>Postęp dnia</span><span class="sum-icon">✳</span></div><div class="sum-num"><span id="doneCount">0</span><small> / <span id="totalCount">0</span> zadań</small></div><div class="progress-track"><i id="progressBar"></i></div></div><div class="sum-card lav"><div class="sum-top"><span>Do zrobienia</span><span class="sum-icon">◷</span></div><div class="sum-num" id="remainingCount">0</div></div><div class="sum-card peach"><div class="sum-top"><span>Ukończone</span><span class="sum-icon">✓</span></div><div class="sum-num" id="completionPct">0<small>%</small></div></div></section>
<div class="tasks-layout"><section><div class="section-head"><h2 id="taskHeading">Plan na dziś</h2><div class="filters"><button class="active" data-filter="all">Wszystkie</button><button data-filter="open">Aktywne</button><button data-filter="done">Gotowe</button></div></div><div id="taskList" class="task-list"></div></section><aside class="side-panel"><h2 class="panel-title">Najbliższe</h2><div id="upNext" class="up-next"></div><div class="note"><div class="note-label"><span>✎ &nbsp;Notatka dnia</span><span>zapisuje się automatycznie</span></div><textarea id="dayNote" placeholder="Zapisz myśl, cel albo coś, o czym chcesz pamiętać…"></textarea></div></aside></div></main></div>
<div class="modal-back" id="modalBack"><form class="modal" id="taskForm"><div class="modal-top"><h2>Nowe zadanie</h2><button type="button" class="close" id="closeModal">×</button></div><div class="field"><label for="title">Co masz do zrobienia?</label><input id="title" required maxlength="90" placeholder="np. Dokończyć prezentację" /></div><div class="form-row"><div class="field"><label for="time">Godzina</label><input id="time" type="time" /></div><div class="field"><label for="priority">Priorytet</label><select id="priority"><option value="medium">Średni</option><option value="high">Wysoki</option><option value="low">Niski</option></select></div></div><div class="field"><label for="category">Kategoria</label><select id="category"><option>Praca</option><option>Osobiste</option><option>Zdrowie</option><option>Inne</option></select></div><button class="save-btn" type="submit">Dodaj do planu</button></form></div><div class="toast" id="toast"></div>
<script src="app.js" defer></script></body></html>
